name: Check SRS specification examples
on:
  pull_request:
    paths:
      - 'docs/SRS/**'
      - 'docs/HazardAnalysis/**'
      - 'test/documentation/**'
      - '.github/workflows/specification-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify guards, metrics, and available shared safety statements
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          command = [sys.executable, 'test/documentation/verify_specification.py']
          hazard = Path('docs/HazardAnalysis/HazardAnalysis.tex').read_text()
          if r'\label{SR1}' in hazard:
              command.append('--with-hazard')
          subprocess.run(command, check=True)
