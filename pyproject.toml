[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.1.0"
description = "Verity POC analysis service and offline benchmark harness"
readme = "src/README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24",
]

[project.scripts]
verity-bench = "benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration"]
pythonpath = ["src", "test"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "docs/|test/fixtures/|test/documentation/"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "test"]
extend-exclude = ["docs", "test/fixtures", "test/documentation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "benchmark", "conftest"]
